  if(newPend){newPend=false;addNewRoom();return;}
  let idx;
  if(roomCount<TUTORIAL.length)idx=TUTORIAL[roomCount];
  else{const tier=roomCount<10?1:roomCount<20?2:3;
    const unlocked=r=>!r.req||oFloor>=ABIL.find(a=>a[1]===r.req)[0];
    const abPool=ROOMS.map((r,i)=>i).filter(i=>ROOMS[i].req&&unlocked(ROOMS[i])&&!recent.includes(i));
    let pool=ROOMS.map((r,i)=>i).filter(i=>ROOMS[i].d<=tier&&unlocked(ROOMS[i])&&!recent.includes(i));
    if(!pool.length)pool=ROOMS.map((r,i)=>i).filter(i=>ROOMS[i].d<=tier&&unlocked(ROOMS[i]));
    // once you have abilities, about half the rooms are built for them (newest ability most often)
    const newest=ABIL.filter(a=>oFloor>=a[0]).pop(),roll=R0();
    if(newest&&roll<0.5&&abPool.length){const nw=abPool.filter(i=>ROOMS[i].req===newest[1]);
      idx=(nw.length&&R0()<0.5)?nw[R0()*nw.length|0]:abPool[R0()*abPool.length|0];}
    else idx=pool[R0()*pool.length|0];}
  lastRoom=idx;recent.push(idx);if(recent.length>12)recent.shift();roomCount++;

// ================= THE CLIMB (co-op expedition) =================
const XTOP=300;
const XIT={food:{n:'Ration',ic:'🍖',w:.5,col:'#ffb36b'},rope:{n:'Rope',ic:'🪢',w:3,col:'#e8c27a'},piton:{n:'Piton',ic:'📌',w:.4,col:'#c9d1e0'},
  medkit:{n:'Medkit',ic:'✚',w:1.5,col:'#ff6b6b'},chalk:{n:'Energy Gel',ic:'⚡',w:.5,col:'#ffe066'},grapple:{n:'Grapple Gun',ic:'🎯',w:2.5,col:'#9fe8ff'}};
const XORD=['food','piton','grapple','medkit','chalk'];
let EXP=null,EXPD=null,vines=[],loot=[],winds=[],rocks=[];
function expPlan(key){const sd=daySeed(key+'climb'),r=seedRng(sd),tpl=[],mir=[],base=[0,START_Y];const rec=[];
  for(let n=1;n<=XTOP;n++){const c=1+4*Math.min(1,(n-1)/260);let t=Math.round(c+(r()+r()-1)*1.2);t=Math.max(1,Math.min(5,t));
    let pool=XLV.map((L,i)=>i).filter(i=>XLV[i].t===t&&!rec.includes(i));if(!pool.length)pool=XLV.map((L,i)=>i).filter(i=>XLV[i].t===t);
    const i=pool[r()*pool.length|0];tpl.push(i);mir.push(r()<.5);rec.push(i);if(rec.length>14)rec.shift();base.push(base[n]-XLV[i].h);}
  return{key,sd,tpl,mir,base};}
function expInit(){EXPD=expPlan(dayKey());vines=[];loot=[];winds=[];rocks=[];
  EXP={lev:new Set(),st:'lobby',team:0,ids:[],cd:null,hostCd:null,hostSet:[],lastRc:0,cur:0,cp:0,built:new Set(),camps:new Set(),lo:1,hi:0,taken:new Set(),go:0,t0:0,won:0,dlg:0};
  const sv=SAVE.expd&&SAVE.expd.k===EXPD.key?SAVE.expd:null;EXP.myCp=sv?sv.cp:0;
  plats.push(mk(0,START_Y,800,'camp',{camp:0}));plats.push(mk(0,START_Y+52,800,'normal'));
  EXP.roof={x:0,y:START_Y-175,w:800,h:22};solids.push(EXP.roof);nextY=-1e9;}
function expAfterStart(){p.ab={};p.airJumps=0;p.st=100;p.hun=100;p.bag={food:2,piton:3};p.sel=0;p.clm=null;p.gpl=null;p.fallTop=p.y;p.down=0;p.owned=[0];p.wpn=0;}
function expWeight(){let w=0;for(const k in p.bag)w+=XIT[k].w*p.bag[k];return Math.round(w*10)/10;}
function expStMax(){return Math.max(25,100-4*expWeight()-Math.max(0,50-p.hun)*.8);}
function expInvList(){return XORD.filter(k=>p.bag[k]>0);}
function expSelK(){const L=expInvList();if(!L.length)return null;p.sel=(p.sel%L.length+L.length)%L.length;return L[p.sel];}
// ---------- world building ----------
function expX(x,w,mir){return mir?800-x-(w||0):x;}
function expBuildLevel(n){if(n<1||n>XTOP||EXP.built.has(n))return;EXP.built.add(n);const L=XLV[EXPD.tpl[n-1]],mir=EXPD.mir[n-1],B=EXPD.base[n];
  (EXP.ids.length<2&&L.solo?L.solo:L.o).forEach((e,idx)=>{const k=e[0],Y=y=>B-y;if('PDLY'.includes(k)){coopBuild(k,e,n,mir,B,idx);return;}
    if(k==='p'||k==='i'||k==='c')plats.push(mk(expX(e[1],e[3],mir),Y(e[2]),e[3],{p:'rock',i:'ice',c:'crumble'}[k],{xl:n}));
    else if(k==='m'){const pl=mk(expX(e[1],e[3],mir),Y(e[2]),e[3],'moving',{axis:e[4],amp:e[5],t:n,spd:e[6],xl:n});pl.ax=pl.x;pl.ay=pl.y;plats.push(pl);}
    else if(k==='g'||k==='G'||k==='s')solids.push({x:expX(e[1],e[3],mir),y:Y(e[2]+e[4]),w:e[3],h:e[4],grip:k!=='s'?1:0,ice:k==='G'?1:0,xl:n});
    else if(k==='v')vines.push({x:expX(e[1],0,mir),y:Y(e[2]),len:e[3],xl:n,sw:n*1.7+idx});
    else if(k==='k')hazards.push({type:'spike',x:expX(e[1],e[3],mir),y:Y(e[2])-14,w:e[3],h:14,xl:n});
    else if(k==='r')rocks.push({x:expX(e[1],0,mir),top:B-L.h,bot:B,per:e[2],off:e[3],xl:n,list:[],next:e[3]});
    else if(k==='w')winds.push({x:expX(e[1],e[3],mir),y:Y(e[2]+e[4]),w:e[3],h:e[4],fx:mir?-e[5]:e[5],xl:n});
    else if(k==='u')drafts.push({x:expX(e[1],e[3],mir),y:Y(e[2]),w:e[3],h:e[4],xl:n});
    else if(k==='f'){const id='L'+n+'_'+idx;if(!EXP.taken.has(id))loot.push({x:expX(e[1],0,mir)+(mir?-20:20),y:Y(e[2]),k:e[3]==='rope'?'piton':e[3],n:1,id,xl:n});}});}
function expBuildCamp(n){if(n<0||n>XTOP||EXP.camps.has(n))return;EXP.camps.add(n);const y=EXPD.base[n+1]??(EXPD.base[XTOP]-XLV[EXPD.tpl[XTOP-1]].h);
  plats.push(mk(0,y,800,'camp',{camp:n,xl:n,big:n>0&&n%10===0,summit:n===XTOP}));
  if(n>0&&n%10===0&&n<XTOP){const r=seedRng(EXPD.sd+n*31),ex=['medkit','chalk','rope','grapple'][r()*4|0];
    [['food',2],['piton',2],[ex,1]].forEach((q,j)=>{const id='C'+n+'_'+j;if(!EXP.taken.has(id))loot.push({x:520+j*40,y,k:q[0],n:q[1],id,xl:n});});}}
function expWindow(){const lo=Math.max(1,EXP.cur-1),hi=Math.min(XTOP,EXP.cur+3);
  if(lo!==EXP.lo){const keep=o=>o.xl===undefined||o.xl>=lo-1;plats=plats.filter(keep);solids=solids.filter(keep);hazards=hazards.filter(keep);drafts=drafts.filter(keep);vines=vines.filter(keep);loot=loot.filter(keep);winds=winds.filter(keep);rocks=rocks.filter(keep);cplates=cplates.filter(keep);clevers=clevers.filter(keep);cdoors=cdoors.filter(keep);
    for(const n of [...EXP.built])if(n<lo)EXP.built.delete(n);for(const n of [...EXP.camps])if(n<lo-1)EXP.camps.delete(n);EXP.lo=lo;}
  for(let n=lo;n<=hi;n++)expBuildLevel(n);for(let n=lo-1;n<=hi;n++)expBuildCamp(n);EXP.hi=hi;}
function expResetWorld(){plats=[];solids=[];hazards=[];drafts=[];vines=[];loot=[];winds=[];rocks=[];cplates=[];clevers=[];cdoors=[];enemies=[];coins=[];orbs=[];hooks=[];crates=[];shrines=[];EXP.built=new Set();EXP.camps=new Set();EXP.lo=-1;expWindow();}
function expCampY(n){return n>=XTOP?EXPD.base[XTOP]-XLV[EXPD.tpl[XTOP-1]].h:EXPD.base[n+1];}
// ---------- lobby / queue ----------
function expMembers(){const now=performance.now(),L=[];if(EXP.st==='lobby')L.push(NET.id);for(const id in NET.exp||{}){const r=NET.exp[id];if(r.st==='L'&&now-r.t<3000)L.push(id);}return L.sort();}
function expStart(team,ids,lv){EXP.team=team;EXP.ids=ids;EXP.st='go';EXP.go=3.2;EXP.cur=lv;EXP.cp=lv;EXP.won=0;EXP.taken=new Set();EXP.lev=new Set();EXP.alone=0;EXP.ropeL=0;
  expResetWorld();EXP.roof={x:0,y:expCampY(lv)-175,w:800,h:22};solids.push(EXP.roof);
  p.x=100+Math.random()*560;p.y=expCampY(lv);p.vx=p.vy=0;p.fallTop=p.y;p.hp=maxHP();p.st=100;camY=Math.min(0,p.y-H*.55);
  popups.push({s:'THE CLIMB  ·  '+EXPD.key,sub:(ids.length>1?ids.length+' climbers together':'solo climb')+'  ·  starting at level '+lv+'  ·  reach '+XTOP+' to win',t:4,big:1});}
function expMsg(m){const now=performance.now(),E=NET.exp||(NET.exp={});
  if(m.x!==undefined)E[m.id]={an:m.an|0,st:m.xs||'R',tm:m.xt||0,dn:m.dn||0,lu:m.lu||0,cp:m.xc||0,lv:m.xl||0,t:now};
  if(m.xrc!==undefined&&EXP.st==='lobby'){const L=expMembers();if(L[0]===m.id){EXP.cd=m.xrc;EXP.lastRc=now;}return true;}
  if(m.xgo!==undefined&&EXP.st==='lobby'&&Array.isArray(m.ids)&&m.ids.includes(NET.id)){expStart(m.xgo,m.ids,m.lv|0);return true;}
  if(m.xt0!==undefined&&m.xt0!==EXP.team)return m.x===undefined;

function connSpans(Lp,mp,op,Ln,mn,on){const sp=[],add=(a,b,pad)=>sp.push([a-pad,b+pad]);

    else if('Pk'.includes(k)&&e[2]<=10){x0=e[1];x1=e[1]+e[3];low=true;}
    else if(k==='m'&&e[2]<=150){const a=e[4]==='x'?e[5]:0;x0=e[1]-a;x1=e[1]+e[3]+a;low=true;}
    else if('gGs'.includes(k)&&e[2]<=150){x0=e[1];x1=e[1]+e[3];low=true;}
    else if((k==='L'||k==='f')&&e[2]<=10){x0=e[1]-20;x1=e[1]+20;low=true;}
    else if((k==='v'||k==='Y')&&e[2]-e[3]<=150){x0=e[1]-30;x1=e[1]+30;low=true;}
    else if(k==='u'&&e[2]-e[4]<=150){x0=e[1];x1=e[1]+e[3];low=true;}
    if(low){const w=x1-x0,a=X(x0,w,mn);add(a,a+w,50);}}
  if(op){const h=Lp.h;for(const e of op){const k=e[0];let top=null,x0,x1;
    if('pic'.includes(k)){top=e[2];x0=e[1];x1=e[1]+e[3];}
    else if(k==='m'){top=e[2]+(e[4]==='y'?e[5]:0);const a=e[4]==='x'?e[5]:0;x0=e[1]-a;x1=e[1]+e[3]+a;}
    else if('gGs'.includes(k)){top=e[2]+e[4];x0=e[1];x1=e[1]+e[3];}
    else if(k==='v'||k==='Y'){top=e[2];x0=e[1]-20;x1=e[1]+20;}
    else if(k==='u'){top=e[2];x0=e[1];x1=e[1]+e[3];}
    if(top!==null&&top>=h-170){const w=x1-x0,a=X(x0,w,mp);add(a,a+w,70);}}}
  sp.sort((a,b)=>a[0]-b[0]);const out=[];for(const s of sp){s[0]=Math.max(0,s[0]);s[1]=Math.min(800,s[1]);if(out.length&&s[0]<=out[out.length-1][1]+120)out[out.length-1][1]=Math.max(out[out.length-1][1],s[1]);else out.push([s[0],s[1]]);}
  if(!out.length)out.push([300,500]);for(const s of out)if(s[1]-s[0]<90){const c=(s[0]+s[1])/2;s[0]=Math.max(0,c-45);s[1]=Math.min(800,c+45);}
  const res=out.map(s=>[Math.round(s[0]),Math.round(s[1]),0]);
  for(let i=0;i+1<out.length;i++){const a=out[i][1],b=out[i+1][0],g=b-a,k=Math.max(1,Math.ceil((g-130)/200)),sp=(g-70*k)/(k+1);
    for(let j=0;j<k;j++){const x=Math.round(a+sp*(j+1)+70*j);res.push([x,x+70,(j%2?14:26)]);}}
  return res;}

      {const used=maxAir()-p.airJumps,kd=(p.ab.dj&&used===1)?'dj':'tj';if(SAVE.up[kd]&&p.ab[kd])p.ajHold={t:0};else startFlip(p.face,1.15);}
